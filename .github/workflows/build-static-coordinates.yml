name: Build static park coordinates

on:
  push:
    paths:
      - '.github/workflows/build-static-coordinates.yml'
      - 'generate-coordinates.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-coordinates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate coordinates from official GIS sources
        run: node generate-coordinates.js
      - name: Promote generated file to checked-in static data
        run: mv park-coordinates.generated.json park-coordinates.json
      - name: Validate snapshot
        run: node -e "const d=require('./park-coordinates.json'); if(d.count!==116||Object.keys(d.parks||{}).length!==116) process.exit(1); console.log('Static coordinates validated: 116/116')"
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add park-coordinates.json
          if git diff --cached --quiet; then
            echo "No coordinate changes to commit"
          else
            git commit -m "Add checked-in 116-park coordinate snapshot [skip ci]"
            git push
          fi
